<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Print the AR.js Hiro marker</title>
<style>
body { text-align: center; font-family: system-ui, sans-serif; padding: 1rem; }
img { width: 110mm; height: 110mm; object-fit: contain; }
@media print { button { display: none; } }
</style></head>
<body>
<h1>Hiro marker</h1>
<p>Print at 100% scale, on flat matte paper. Measure the black border's outside width for calibration.</p>
<img alt="The official Hiro marker" src="https://raw.githubusercontent.com/AR-js-org/AR.js/master/data/images/hiro.png">
<p><button onclick="window.print()">Print marker</button></p>
<p>Internet is required to load the marker image on this page. Alternatively save it from
<a href="https://raw.githubusercontent.com/AR-js-org/AR.js/master/data/images/hiro.png">the AR.js source</a>.</p>
</body></html>
